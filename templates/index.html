{% extends "base.html" %}

{% block title %}Review ticket · SupportOps Copilot{% endblock %}

{% block content %}
  <h1>Support ticket review</h1>
  <p>Route the ticket, retrieve policy evidence, and create a draft for human review.</p>

  <section>
    <form method="post" action="/review">
      <label for="ticket-text">Customer ticket</label>
      <textarea id="ticket-text" name="ticket_text" minlength="3" required>{{ ticket_text }}</textarea>
      {% if error %}
        <p class="error" role="alert">{{ error }}</p>
      {% endif %}
      <button type="submit">Create review</button>
    </form>
  </section>
{% endblock %}
